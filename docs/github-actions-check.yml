name: Offline workflow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tools/mosaic-workbench/tests -v
      - run: python -m unittest discover -s tools/library-to-mosaic/tests -v
      - run: python tools/mosaic-workbench/doctor.py --json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/mosaic-workbench/web/app.js
      - run: python scripts/smoke_test.py
